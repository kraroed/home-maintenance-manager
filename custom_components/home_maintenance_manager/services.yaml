complete_task:
  name: Complete maintenance task
  description: Record a task completion and optionally save notes in its permanent history.
  fields:
    task_id:
      name: Task ID
      description: The maintenance task ID to complete.
      required: true
      selector:
        text:
    integration_instance:
      name: Integration instance
      description: The integration storage key, required when multiple entries contain the same task ID.
      required: false
      selector:
        text:
    notes:
      name: Completion notes
      description: Optional work performed, findings, parts used, or service details.
      required: false
      selector:
        text:
          multiline: true

reschedule_task:
  name: Reschedule maintenance task
  description: Change the next due date without marking the task complete. The change is retained in the task's schedule history.
  fields:
    task_id:
      name: Task ID
      description: The maintenance task ID to reschedule.
      required: true
      selector:
        text:
    integration_instance:
      name: Integration instance
      description: The integration storage key, required when multiple entries contain the same task ID.
      required: false
      selector:
        text:
    due_date:
      name: New due date
      description: The new scheduled date, today or later.
      required: true
      selector:
        date:
    reason:
      name: Reason
      description: Optional reason for changing the schedule.
      required: false
      selector:
        text:
          multiline: true

export_history:
  name: Export maintenance history
  description: Export the completion history to CSV, JSON, or both formats.
  fields:
    format:
      name: Export format
      description: Choose which file formats to create.
      required: false
      default: both
      selector:
        select:
          options:
            - csv
            - json
            - both

create_backup:
  name: Create JSON backup
  description: Save a complete JSON backup of one property or every configured property.
  fields:
    integration_instance:
      name: Integration instance
      description: Optional config entry ID or storage key when backing up one property.
      selector:
        text:

preview_restore:
  name: Preview JSON restore
  description: Validate a backup and show its contents without changing live data.
  fields:
    filename:
      name: Backup filename
      description: JSON filename placed in the property's protected backup folder.
      required: true
      selector:
        text:
    integration_instance:
      name: Integration instance
      description: Config entry ID or storage key for the property to restore.
      selector:
        text:

restore_backup:
  name: Restore JSON backup
  description: Restore a validated backup after creating an automatic pre-restore backup. Existing completion history is retained.
  fields:
    filename:
      name: Backup filename
      description: JSON filename previously previewed.
      required: true
      selector:
        text:
    confirm:
      name: Confirm restore
      description: Must be enabled to apply the restore.
      required: true
      default: false
      selector:
        boolean:
    integration_instance:
      name: Integration instance
      description: Config entry ID or storage key for the property to restore.
      selector:
        text:
