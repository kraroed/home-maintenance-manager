name: Home Assistant validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pytest-homeassistant-custom-component
      - name: Run integration regression tests
        run: pytest -q
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
